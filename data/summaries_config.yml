# Configuration for creating summary plots across assays.

# --------------------------------------------------------------------------------------
# Define how to create an integrated set of line plots and heat maps that summarizes
# antibody escape alongside other assays (eg, functional effects of mutations).
# --------------------------------------------------------------------------------------


# define defaults shared across summaries
summary_default: &summary_default
  min_times_seen: 2  # only include mutations with times_seen >= this
  min_frac_models: 1  # only include mutations in >= this fraction of models (selections)
  alphabet: [A, C, D, E, F, G, H, I, K, L, M, N, P, Q, R, S, T, V, W, Y]  # amino acids to include
  init_floor_escape_at_zero: false  # initially floor site escape to be >= 0?
  init_site_escape_stat: sum  # initially show site escape as this statistic

cell_entry_default: &cell_entry_default
  stat: effect  # column to plot
  positive_color: "#0072B2"  # light blue, positive heatmap color
  negative_color: "#E69F00"  # orange, negative heatmap color
  max_at_least: 2
  min_at_least: -1
  init_floor_at_zero: false
  init_site_statistic: mean
  init_min_value: null
  addtl_slider_stats:
    times_seen: 2
    n_selections: 2
    effect_std: 1.5
  addtl_slider_stats_as_max: [effect_std]
  le_filters:
    effect_std: 1.5

pH_stability_default: &pH_stability_default
  stat: stability_median  # column to plot
  positive_color: "#4DAC26" 
  negative_color: "#E7298A"
  max_at_least: 1
  min_at_least: -1
  init_min_value: null
  le_filters:
    stability_std: 0.85

# Entry in 293T cells with different TfR1s
entry_293T-various-TfR1s:
  <<: *summary_default
  antibody_escape: {}
  other_phenotypes:
    entry in C callosus TfR1 cells:
      <<: *cell_entry_default
      csv: results/func_effects/averages/293T-TFRC-KO-C-callosus-TfR1_func_effects.csv
    entry in C musculinus TfR1 cells:
      <<: *cell_entry_default
      csv: results/func_effects/averages/293T-TFRC-KO-C-musculinus-TfR1_func_effects.csv

# Summary of cell entry and pH stability
cell_entry_and_pH_stability:
  <<: *summary_default
  antibody_escape: {}
  other_phenotypes:
    entry in C callosus TfR1 cells:
      <<: *cell_entry_default
      csv: results/func_effects/averages/293T-TFRC-KO-C-callosus-TfR1_func_effects.csv
    entry in C musculinus TfR1 cells:
      <<: *cell_entry_default
      csv: results/func_effects/averages/293T-TFRC-KO-C-musculinus-TfR1_func_effects.csv
    pH stability:
      <<: *pH_stability_default
      csv: results/stability/averages/stability_mut_effect.csv

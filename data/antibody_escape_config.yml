    #       step: 1
    #   avg_type: median
    #   per_model_tooltip: true
    # plot_hide_stats: *plot_hide_stats_default
    <<: *avg_antibody_escape_default
    title: Escape map for SCH23-y2021-s056
    selections:
      - LibA-260506-pH-1
      - LibB-260506-pH-1
  